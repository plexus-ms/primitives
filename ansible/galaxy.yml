namespace: plexus             # not "plexus-ms": collection namespaces forbid hyphens
name: platform
version: 0.40.0                # mirrors the release-train tag — written by the umbrella ship task.
                              # SCM installs record this version (a moved git tag alone is a silent
                              # no-op on reinstall); ansible-galaxy reinstalls on any DIFFERENT
                              # version, so the one-time drop from the decoupled 5.x line was safe
readme: README.md
authors:
  - David Julian Albers
description: >-
  Shared Plexus host roles. Every host: configure_base, configure_hostname,
  configure_sshd, configure_iam, configure_unattended_upgrades,
  configure_firewall, configure_mail, install_and_join_netbird. A tenant's app
  hosts: configure_deploy_user, install_docker, install_caddy,
  configure_ingress, configure_apps, install_alloy. The hosting layer:
  configure_proxmox, configure_pbs, configure_haproxy.
license:
  - GPL-3.0-or-later
repository: https://github.com/plexus-ms/platform
tags: [infrastructure]
dependencies:
  community.general: ">=9.0.0"
  ansible.posix: ">=1.5.0"
