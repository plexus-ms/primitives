---
- name: "{{ app.name }} | resolve app dir"
  ansible.builtin.set_fact:
    app_dir: "{{ plexus_deploy_root }}/{{ plexus_tenant }}/{{ app.name }}"

- name: "{{ app.name }} | create app dir"
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ plexus_deploy_user }}"
    group: "{{ plexus_deploy_user }}"
    mode: "0750"

# The app's run shape — compose.yaml and env.schema — is NOT placed here. It
# lives in the app's source repo (an app repo, or this platform repo's own
# apps/<name>/ for third-party software) and the deploy verb places it at
# deploy time, so the compose file on the host always matches the image being
# deployed (§ 5.2 PLX). Five files in the app dir, one writer each (§ 7.2 PLX):
# this playbook owns platform.env and secrets.env; the deploy verb owns .env,
# compose.yaml and env.schema.

# Non-secret platform bindings and values (§ 5.4, § 7.1 PLX): the host port
# assigned in the tenant's inventory, interpolated by compose as
# ${PLEXUS_APP_PORT}; the compose project name; and every non-secret value the
# inventory provides for the app (`app.env`). The project name defaults to the
# app dir's basename, which collides the moment two co-hosted tenants deploy an
# app with the same name — so it is pinned tenant-scoped here; compose honors
# COMPOSE_PROJECT_NAME from --env-file. The platform playbook is this file's
# only writer and always overwrites — the inventory is the truth.
- name: "{{ app.name }} | write platform.env with the host-port binding and values"
  ansible.builtin.copy:
    dest: "{{ app_dir }}/platform.env"
    content: |
      PLEXUS_APP_PORT={{ app.port }}
      COMPOSE_PROJECT_NAME={{ plexus_tenant }}-{{ app.name }}
      {% for key, value in (app.env | default({})).items() %}
      {{ key }}={{ value }}
      {% endfor %}
    owner: "{{ plexus_deploy_user }}"
    group: "{{ plexus_deploy_user }}"
    mode: "0640"
  notify: Re-create app containers

# Substance stays on the host: per-app secrets from the tenant's `app.secrets` dict
# (fed from 1Password via `op run`), injected into the container by the app's compose
# `env_file`. Ownership is deliberately split — the deploy verb owns and
# clobbers .env, the platform playbook owns secrets.env, and neither ever
# writes the other's file.
- name: "{{ app.name }} | place secrets.env"
  ansible.builtin.copy:
    dest: "{{ app_dir }}/secrets.env"
    content: |
      {% for key, value in app.secrets.items() %}
      {{ key }}={{ value }}
      {% endfor %}
    owner: "{{ plexus_deploy_user }}"
    group: "{{ plexus_deploy_user }}"
    mode: "0600"
  when: app.secrets is defined
  no_log: true
  notify: Re-create app containers

- name: "{{ app.name }} | log in to GHCR as the deploy user"
  ansible.builtin.command:
    cmd: "docker login ghcr.io -u {{ plexus_ghcr_user }} --password-stdin"
    stdin: "{{ plexus_ghcr_token }}"
  become_user: "{{ plexus_deploy_user }}"
  when: plexus_ghcr_token | length > 0
  no_log: true
  changed_when: false

# Nothing to bring up until the deploy verb has placed the run shape: a fresh
# host stays provisioned-but-empty until the first CI deploy (or a hand-run of
# the verb), which is the operator's supervised act (§ 8.4 PLX).
- name: "{{ app.name }} | check whether the deploy verb has placed compose.yaml"
  ansible.builtin.stat:
    path: "{{ app_dir }}/compose.yaml"
  register: app_compose

# Runs as the deploy user so a private registry works: that's where the GHCR
# login above put the credentials, and it's the same user the CI deploy verb
# uses — playbook runs and CI deploys pull with one identity.
- name: "{{ app.name }} | pull + start"
  when: plexus_up | bool and app_compose.stat.exists
  become_user: "{{ plexus_deploy_user }}"
  block:
    # --env-file replaces compose's implicit .env lookup, so both files are
    # passed explicitly: .env (deploy-verb-owned image ref) + platform.env
    # (playbook-owned bindings). Same wiring as the deploy verb's.
    - name: "{{ app.name }} | docker compose pull"
      ansible.builtin.command:
        cmd: docker compose --env-file .env --env-file platform.env pull
        chdir: "{{ app_dir }}"
      changed_when: false
    - name: "{{ app.name }} | docker compose up -d"
      ansible.builtin.command:
        cmd: docker compose --env-file .env --env-file platform.env up -d
        chdir: "{{ app_dir }}"
      register: compose_up
      changed_when: "'Started' in compose_up.stderr or 'Recreated' in compose_up.stderr or 'Created' in compose_up.stderr"
  rescue:
    - name: "{{ app.name }} | image not pullable (registry login or a first deploy pending)"
      ansible.builtin.debug:
        msg: >-
          {{ app.name }}: could not pull or start from the compose file on the host.
          Run the CI deploy (or the deploy verb by hand) to bring it up.

- name: "{{ app.name }} | remember the app dir for the rotation handler"
  ansible.builtin.set_fact:
    plexus_app_dirs: "{{ (plexus_app_dirs | default([])) + [app_dir] }}"
