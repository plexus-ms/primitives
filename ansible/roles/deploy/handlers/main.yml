---
# Rotation closes inside the playbook (§ 7.2 PLX): environment is injected at
# container creation, so a rewritten secrets.env or platform.env rotates a file,
# not a credential, until the affected containers are re-created. `up -d` with
# the same env-file wiring as the deploy verb re-creates exactly the services
# whose environment differs. Skipped where the deploy verb has not placed a
# compose file yet. (The single-encoding compose-up verb is deferred — see the
# Manual's roadmap; until it ships this handler mirrors the verb's wiring.)
- name: Re-create app containers
  ansible.builtin.command:
    cmd: docker compose --env-file .env --env-file platform.env up -d
    chdir: "{{ item }}"
  loop: "{{ plexus_app_dirs | default([]) }}"
  become_user: "{{ plexus_deploy_user }}"
  when: plexus_up | bool
  register: recreate
  changed_when: "'Recreated' in recreate.stderr or 'Started' in recreate.stderr"
  failed_when: recreate.rc != 0 and 'no configuration file' not in recreate.stderr
