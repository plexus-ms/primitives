---
- name: Restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted

- name: Apply sysctl settings
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: true

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart the sysstat collect timer
  ansible.builtin.systemd_service:
    name: sysstat-collect.timer
    state: restarted
