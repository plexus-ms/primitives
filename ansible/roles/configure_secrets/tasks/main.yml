---
# Secrets are vault references, never values (PLX-Secrets): every entry of
# apps[].secrets is an op:// pointer, resolved below at playbook time.
- name: Assert app secrets are op:// pointers
  ansible.builtin.assert:
    that:
      - >-
        plexus_apps | map(attribute='secrets', default={}) | map('dict2items') | flatten
        | map(attribute='value') | reject('match', '^op://') | list | length == 0
    fail_msg: "Every apps[].secrets value must be an op://vault/item/field pointer (PLX-Secrets) — values never live in git."

- name: Write each app's secrets
  ansible.builtin.include_tasks: app.yml
  loop: "{{ plexus_apps }}"
  loop_control:
    loop_var: app
    label: "{{ app.name }}"
