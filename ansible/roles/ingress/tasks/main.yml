---
# Configure-phase counterpart of the caddy role (§ 7.1 PLX): caddy (provision
# phase) installs and enables the server; this role owns the routing config.
# Requires a provisioned host — the `caddy validate` step needs the binary.

# Host→port→app is one inventory record per app, so per-VM port uniqueness
# is checkable right here instead of being coordination state (§ 7.1 PLX).
- name: Assert loopback ports are unique per VM
  ansible.builtin.assert:
    that:
      - plexus_apps | map(attribute='loopback_port') | list | unique | length == plexus_apps | length
    fail_msg: "Duplicate loopback port in plexus_apps — each app needs its own loopback_port."

# A host is one site; the apps on it are told apart by path prefix (§ 7.1 PLX).
# A prefix is a plain path — leading slash, no trailing slash, no wildcard —
# and each host serves at most one app per prefix, and at most one at its root.
- name: Assert app path prefixes are well-formed
  ansible.builtin.assert:
    that:
      - plexus_apps | selectattr('path', 'defined') | map(attribute='path') | reject('match', '^(/[A-Za-z0-9._~-]+)+$') | list | length == 0
    fail_msg: "apps[].path must look like /name or /a/b — leading slash, no trailing slash, no wildcard."

- name: Assert each host serves one app per path prefix
  ansible.builtin.assert:
    that:
      - plexus_apps | map(attribute='host') | zip(plexus_apps | map(attribute='path', default='')) | map('join') | list | unique | length == plexus_apps | length
    fail_msg: "Two apps in plexus_apps share a host and a path prefix (or both serve the host's root)."

# Routing is per-tenant: this playbook writes only its own tenant's file, so
# co-hosted tenants never touch each other's routes. The fragment lands before
# the root stub so the stub's import glob always matches when it is validated
# — which also migrates a pre-split host (monolithic root) in one run.
- name: Create the per-tenant routing directory
  ansible.builtin.file:
    path: /etc/caddy/tenants
    state: directory
    mode: "0755"

- name: "Configure this tenant's routes (reverse proxy + automatic HTTPS)"
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "/etc/caddy/tenants/{{ plexus_tenant }}.caddy"
    mode: "0644"
    validate: "caddy validate --config %s --adapter caddyfile"
  notify: Reload caddy

- name: Load Cloudflare's ranges
  ansible.builtin.include_vars:
    file: cloudflare.yml
  when: plexus_ingress_trusted_proxies == 'cloudflare'

# No validate: here — ansible validates a temp copy in a temp dir, where the
# stub's relative import glob cannot resolve. The real check is the next task.
- name: Write the root Caddyfile (host-level options, import of the per-tenant files)
  ansible.builtin.template:
    src: root.Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    mode: "0644"
  notify: Reload caddy

# Validates the combined config in place — root stub plus every tenant's
# fragment, including ones other tenants wrote — before the reload handler
# fires at end of play.
- name: Validate the assembled Caddy config
  ansible.builtin.command:
    cmd: caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
  changed_when: false
