---
# deb822_repository fetches and stores the signing key itself (needs
# python3-debian on the host — configure_base installs it). It does NOT refresh the apt
# cache; the install task below does, via update_cache.
- name: Add Caddy apt repository
  ansible.builtin.deb822_repository:
    name: caddy
    types: deb
    uris: https://dl.cloudsmith.io/public/caddy/stable/deb/debian
    suites: any-version
    components: main
    signed_by: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
    state: present

- name: Install Caddy
  ansible.builtin.apt:
    name: caddy
    state: present
    update_cache: true

# No Caddyfile here: routing config is configure-phase state, owned by the
# configure_ingress role. The package ships a default Caddyfile serving a static page
# on :80; that transient stands until the first configure-playbook run templates
# the real config — acceptable: it discloses nothing, and TLS certs are only
# requested once real domains are configured.
- name: Open HTTP and HTTPS in the host firewall
  ansible.builtin.include_role:
    name: plexus.platform.configure_firewall
    tasks_from: fragment
  vars:
    configure_firewall_fragment_name: caddy
    configure_firewall_fragment_rules: |
      add rule inet firewall input tcp dport { 80, 443 } accept

- name: Enable and start Caddy
  ansible.builtin.systemd_service:
    name: caddy
    state: started
    enabled: true
