---
# One guest. UEFI with Secure Boot on a q35 machine, the system disk imported
# from the cloud image, a serial console (`qm terminal`), and a cloud-init
# drive that Proxmox fills from the fields below. On its first boot the guest
# upgrades its packages (Proxmox's default), so it is current however old the
# pinned image is.
#
# A guest whose creation stops halfway exists and is left alone from then on;
# `qm destroy <vmid> --purge` and re-run.
- name: "Create the guest | {{ item.name }}"
  ansible.builtin.command:
    argv: >-
      {{ [
           'qm', 'create', item.vmid | string,
           '--name', item.name,
           '--description', item.description | default(''),
           '--ostype', 'l26',
           '--machine', 'q35',
           '--bios', 'ovmf',
           '--efidisk0', configure_guests_storage ~ ':1,efitype=4m,pre-enrolled-keys=1',
           '--cpu', configure_guests_cpu,
           '--cores', item.cores | string,
           '--memory', item.memory | string,
           '--scsihw', 'virtio-scsi-single',
           '--scsi0', configure_guests_storage ~ ':0,import-from=' ~ configure_guests_image ~ ',discard=on,iothread=1,ssd=1',
           '--ide2', configure_guests_storage ~ ':cloudinit',
           '--boot', 'order=scsi0',
           '--serial0', 'socket',
           '--vga', 'serial0',
           '--agent', 'enabled=1',
           '--rng0', 'source=/dev/urandom',
           '--tablet', '0',
           '--onboot', '1',
           '--ciuser', configure_guests_admin.name,
           '--sshkeys', configure_guests_ssh_keys,
           '--nameserver', configure_guests_nameservers | join(' ')
         ]
         + (['--searchdomain', configure_guests_domain] if configure_guests_domain | length > 0 else []) }}
  changed_when: true

- name: "Attach the network interfaces | {{ item.name }}"
  ansible.builtin.command:
    argv:
      - qm
      - set
      - "{{ item.vmid }}"
      - "--net{{ idx }}"
      - "virtio{{ (',macaddr=' ~ net.mac) if net.mac is defined else '' }},bridge={{ net.bridge }},firewall=1"
      - "--ipconfig{{ idx }}"
      - "ip={{ net.ip }}{{ (',gw=' ~ net.gw) if net.gw is defined else '' }}"
  loop: "{{ item.nets }}"
  loop_control:
    loop_var: net
    index_var: idx
    label: "net{{ idx }}"
  changed_when: true

- name: "Grow the system disk | {{ item.name }}"
  ansible.builtin.command:
    cmd: qm disk resize {{ item.vmid }} scsi0 {{ item.disk }}
  changed_when: true

- name: "Start the guest | {{ item.name }}"
  ansible.builtin.command:
    cmd: qm start {{ item.vmid }}
  changed_when: true
