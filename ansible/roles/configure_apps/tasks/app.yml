---
- name: "{{ app.name }} | resolve app dir"
  ansible.builtin.set_fact:
    configure_apps_dir: "{{ plexus_deploy_root }}/{{ plexus_tenant }}/{{ app.name }}"

- name: "{{ app.name }} | create app dir"
  ansible.builtin.file:
    path: "{{ configure_apps_dir }}"
    state: directory
    owner: "{{ plexus_deploy_user }}"
    group: "{{ plexus_deploy_user }}"
    mode: "0750"

# The app's run shape — compose.yaml — is NOT placed here. It lives in the
# app's source repo (an app repo, or this platform repo's own apps/<name>/ for
# third-party software) and the deploy verb renders it at deploy time with the
# image pinned, so the compose file on the host always names the image it
# serves (§ 5.2 PLX). Three files in the app dir, one writer each (§ 7.2 PLX):
# this playbook owns .env and .env.secret; the deploy verb owns compose.yaml.
# Compose reads .env from the project dir implicitly, so every invocation —
# the verb's, the rotation handler's, a human's — is a bare `docker compose`.

# .env (§ 5.3, § 7.1 PLX), three sections: compose's own setting, the reserved
# PLEXUS_ bindings, then the non-secret values the inventory provides for the
# app (`app.env`). The project name defaults to the app dir's basename, which
# collides the moment two co-hosted tenants deploy an app with the same name
# — so it is pinned tenant-scoped here. The loopback port is the one assigned
# in the inventory, interpolated by compose as ${PLEXUS_LOOPBACK_PORT}. This
# playbook is the file's only writer and always overwrites — the inventory is
# the truth.
- name: "{{ app.name }} | write .env (compose setting, platform bindings, values)"
  ansible.builtin.copy:
    dest: "{{ configure_apps_dir }}/.env"
    content: |
      # Written by the configure playbook from the tenant inventory. Do not edit.
      # Compose settings.
      COMPOSE_PROJECT_NAME={{ plexus_tenant }}-{{ app.name }}

      # Platform bindings (reserved PLEXUS_ prefix, § 5.4 PLX).
      PLEXUS_LOOPBACK_PORT={{ app.loopback_port }}

      # Values from the inventory record, apps[].env (§ 7.1 PLX).
      {% for key, value in (app.env | default({})).items() %}
      {{ key }}={{ value }}
      {% endfor %}
    owner: "{{ plexus_deploy_user }}"
    group: "{{ plexus_deploy_user }}"
    mode: "0640"
  notify: Re-create app containers

# Substance stays on the host: per-app secrets from the tenant's `app.secrets`
# dict — op:// pointers, resolved from the vault here via the 1Password CLI
# the playbook wrapper already runs under — injected into the container by the
# app's compose `env_file`. Never world-readable.
- name: "{{ app.name }} | write .env.secret (vault-resolved secrets)"
  ansible.builtin.copy:
    dest: "{{ configure_apps_dir }}/.env.secret"
    content: |
      # Written by the configure playbook from the tenant inventory, apps[].secrets,
      # resolved from the vault (§ 7.2 PLX). Do not edit.
      {% for key, ref in app.secrets.items() %}
      {{ key }}={{ lookup('ansible.builtin.pipe', 'op read ' ~ (ref | quote)) }}
      {% endfor %}
    owner: "{{ plexus_deploy_user }}"
    group: "{{ plexus_deploy_user }}"
    mode: "0600"
  when: app.secrets is defined
  no_log: true
  notify: Re-create app containers

- name: "{{ app.name }} | log in to GHCR as the deploy user"
  ansible.builtin.command:
    cmd: "docker login ghcr.io -u {{ plexus_ghcr_user }} --password-stdin"
    stdin: "{{ plexus_ghcr_token }}"
  become: true
  become_user: "{{ plexus_deploy_user }}"
  when: plexus_ghcr_token | length > 0
  no_log: true
  changed_when: false

# Nothing to bring up until the deploy verb has placed the run shape: a fresh
# host stays provisioned-but-empty until the first CI deploy (or a hand-run of
# the verb), which is the operator's supervised act (§ 8.4 PLX).
- name: "{{ app.name }} | check whether the deploy verb has placed compose.yaml"
  ansible.builtin.stat:
    path: "{{ configure_apps_dir }}/compose.yaml"
  register: configure_apps_compose

# Runs as the deploy user so a private registry works: that's where the GHCR
# login above put the credentials, and it's the same user the CI deploy verb
# uses — playbook runs and CI deploys pull with one identity.
- name: "{{ app.name }} | pull + start"
  when: plexus_up | bool and configure_apps_compose.stat.exists
  become: true
  become_user: "{{ plexus_deploy_user }}"
  block:
    - name: "{{ app.name }} | docker compose pull"
      ansible.builtin.command:
        cmd: docker compose pull
        chdir: "{{ configure_apps_dir }}"
      changed_when: false
    - name: "{{ app.name }} | docker compose up -d"
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "{{ configure_apps_dir }}"
      register: configure_apps_up
      changed_when: "'Started' in configure_apps_up.stderr or 'Recreated' in configure_apps_up.stderr or 'Created' in configure_apps_up.stderr"
  rescue:
    - name: "{{ app.name }} | image not pullable (registry login or a first deploy pending)"
      ansible.builtin.debug:
        msg: >-
          {{ app.name }}: could not pull or start from the compose file on the host.
          Run the CI deploy (or the deploy verb by hand) to bring it up.

- name: "{{ app.name }} | remember the app dir for the rotation handler"
  ansible.builtin.set_fact:
    configure_apps_dirs: "{{ (configure_apps_dirs | default([])) + [configure_apps_dir] }}"
