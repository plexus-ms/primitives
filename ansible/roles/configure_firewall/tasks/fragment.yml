---
# Adds one role's rules to the firewall. Called by the role that opens the
# listener:
#
#   - ansible.builtin.include_role:
#       name: plexus.platform.configure_firewall
#       tasks_from: fragment
#     vars:
#       configure_firewall_fragment_name: caddy
#       configure_firewall_fragment_rules: |
#         add rule inet firewall input tcp dport { 80, 443 } accept
#
# On a host where configure_firewall has not run the fragment is written and
# inert; the role loads it when it runs.
- name: Create the fragment directory
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write the firewall fragment {{ configure_firewall_fragment_name }}
  ansible.builtin.copy:
    dest: /etc/nftables.d/{{ configure_firewall_fragment_name }}.nft
    owner: root
    group: root
    mode: "0644"
    content: |
      # Written by the plexus.platform collection; loaded by /etc/nftables.conf.
      {{ configure_firewall_fragment_rules }}
  register: configure_firewall_fragment

# The nftables package ships its own /etc/nftables.conf, which flushes every
# table; only this role's file may be loaded.
- name: Check whether this role's firewall is installed
  ansible.builtin.command:
    cmd: grep -qs 'table inet firewall' /etc/nftables.conf
  register: configure_firewall_installed
  changed_when: false
  failed_when: false
  check_mode: false

# On every run, so the live rules equal the files. A fragment the rules do not
# load with is removed again: left on disk it would keep the whole firewall
# from loading at the next boot.
- name: Load the fragment
  when: configure_firewall_installed.rc == 0
  block:
    - name: Load the firewall rules with the fragment
      ansible.builtin.command:
        cmd: nft -f /etc/nftables.conf
      changed_when: configure_firewall_fragment is changed
  rescue:
    - name: Remove the fragment that does not load
      ansible.builtin.file:
        path: /etc/nftables.d/{{ configure_firewall_fragment_name }}.nft
        state: absent

    - name: Fail
      ansible.builtin.fail:
        msg: >-
          The firewall does not load with the fragment
          {{ configure_firewall_fragment_name }}; the fragment was removed and
          the previous rules are still in force.
