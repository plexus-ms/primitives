---
# Runs after the roles that add fragments (install_caddy, …): the first load
# on a host then already admits their ports.
- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present

- name: Create the fragment directory
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write the firewall rules
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0755"
    validate: nft -c -f %s

# Loaded on every run, not from a handler: a load is atomic, replaces only
# this role's table, and makes the live rules equal the files even after a
# run that was interrupted between writing and loading.
- name: Load the firewall rules
  ansible.builtin.command:
    cmd: nft -f /etc/nftables.conf
  changed_when: false

- name: Load the rules at boot
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true

# ufw was the firewall of earlier versions of this collection; two firewalls
# on one host would both have to admit a port. The new rules are in force
# before the old firewall goes.
- name: Check for ufw
  ansible.builtin.stat:
    path: /usr/sbin/ufw
  register: configure_firewall_ufw

- name: Replace ufw
  when: configure_firewall_ufw.stat.exists
  block:
    - name: Disable ufw
      ansible.builtin.command:
        cmd: ufw --force disable
      changed_when: true

    # Disabling ufw resets the forward policy to accept; ufw held it at drop,
    # and Docker only sets it again when its daemon next starts.
    - name: Keep the forward policy ufw held
      ansible.builtin.command:
        cmd: "{{ item }} -P FORWARD DROP"
      loop:
        - iptables
        - ip6tables
      changed_when: true

    - name: Remove ufw
      ansible.builtin.apt:
        name: ufw
        state: absent
        purge: true
