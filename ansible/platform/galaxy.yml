namespace: plexus             # not "plexus-ms": collection namespaces forbid hyphens
name: platform
version: 0.118.0                # mirrors the release-train tag — written by plx ship.
                              # SCM installs record this version (a moved git tag alone is a silent
                              # no-op on reinstall); ansible-galaxy reinstalls on any DIFFERENT version.
readme: README.md
authors:
  - David Julian Albers
description: >-
  The platform layer (PLX-Platform): what makes an existing host run a tenant's apps —
  deploy_user, caddy, ingress, secrets, apps — and the playbook plexus.platform.playbook that
  mounts them with the host baseline on the inventory group platform.
