name: _verify

# Mounts the verify verb (§ 1 PLX-Delivery): perform every automated step that
# ascertains code quality. One invocation of the contract verb, repo-wide or
# scoped to one app and its dependencies; the incantations are the repo's own.

on:
  workflow_call:
    inputs:
      scope:
        description: >-
          Optional scope for the verb: an app and its dependency packages
          (`apps/<app>...`, turbo's dependency-inclusive filter, applied
          inside the verb). Empty verifies the whole repo.
        required: false
        type: string
        default: ''
      runner:
        description: >-
          Runner label for every job: GitHub's `ubuntu-latest`, or the label of a
          runner the tenant owns (GitHub bills minutes only on its own runners).
        required: false
        type: string
        default: ubuntu-latest
      persistent:
        description: >-
          The runner keeps its disk between jobs (a runner the tenant owns):
          caches then stay on the machine instead of round-tripping through
          GitHub (§ 4 PLX-Delivery).
        required: false
        type: boolean
        default: false
      turbo-cache-endpoint:
        description: >-
          S3 endpoint of the bucket that backs Turbo's remote cache (§ 8
          PLX-Delivery), e.g. https://fsn1.your-objectstorage.com. Empty for
          a provider the server knows by region alone.
        required: false
        type: string
        default: ''
      turbo-cache-region:
        description: Region of that bucket, e.g. fsn1.
        required: false
        type: string
        default: ''
      turbo-cache-bucket:
        description: >-
          Bucket that backs Turbo's remote cache, shared by every job of the
          repo. Empty leaves Turbo with the local cache alone.
        required: false
        type: string
        default: ''
    secrets:
      turbo-cache-access-key:
        description: Access key for the remote cache's bucket.
        required: false
      turbo-cache-secret-key:
        description: Secret key for the remote cache's bucket.
        required: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7
      # Turbo's remote cache (§ 8 PLX-Delivery): a cache server for the length
      # of the job, on loopback, backed by the tenant's bucket, so that a task
      # whose inputs did not change is replayed from any earlier job on any
      # runner. Its token is minted per job and never leaves the machine; the
      # port is the first free one, since a host can run several runners.
      - id: turbo-cache
        name: Prepare the Turbo remote cache
        if: ${{ inputs.turbo-cache-bucket != '' }}
        run: |
          port=8585
          while (exec 3<>"/dev/tcp/127.0.0.1/$port") 2>/dev/null; do port=$((port + 1)); done
          token=$(openssl rand -hex 32)
          echo "::add-mask::$token"
          echo "port=$port" >> "$GITHUB_OUTPUT"
          {
            echo "TURBO_API=http://127.0.0.1:$port"
            echo "TURBO_TOKEN=$token"
            echo "TURBO_TEAM=${GITHUB_REPOSITORY//\//-}"
          } >> "$GITHUB_ENV"
      - uses: brunojppb/turbo-cache-server@7a089b8e7cf1579794644119a3561bbb1314c946 # 5.0.0
        if: ${{ inputs.turbo-cache-bucket != '' }}
        env:
          PORT: ${{ steps.turbo-cache.outputs.port }}
          S3_ENDPOINT: ${{ inputs.turbo-cache-endpoint }}
          S3_REGION: ${{ inputs.turbo-cache-region }}
          S3_BUCKET_NAME: ${{ inputs.turbo-cache-bucket }}
          S3_ACCESS_KEY: ${{ secrets.turbo-cache-access-key }}
          S3_SECRET_KEY: ${{ secrets.turbo-cache-secret-key }}
          S3_USE_PATH_STYLE: 'true'
      - uses: jdx/mise-action@v5
        with:
          cache: ${{ !inputs.persistent }}
      - run: mise verify ${{ inputs.scope }}
