name: _verify

# Mounts `verify` for an app repo (§§ 1, 2 and 8 PLX-Delivery): build every
# app's image and test it, for the whole repo and run. The tenant's on_pr.yml
# and on_push.yml run it after _check.yml, which gates it: a commit that
# fails the check builds and launches nothing. The logic is plx-ci's
# (@plexus-ms/cli-ci, pinned in the caller's mise.toml); every step here is
# one invocation.
#
#   plan      small   the build and test hashes from one Turbo dry run, the look-ups, the
#                     matrices; under hybrid, one instance per image to build and test to run
#   build     large   the image from the pruned context, pushed to the registry as build-<hash>
#   test      large   the app's compose stack on the candidate, its tests, the tag test-<hash>
#   cleanup   small   hybrid only: delete what this run launched
#
# Where a job of a size runs is the strategy's (`strategy`): the forge's
# runners, the slots of the tenant's runner hosts, or, for a large job under
# hybrid, an instance of its own. Where the candidates live is `registry`:
# the pair on the tenant's object storage, or the forge's registry.
#
# A decision comes from a content hash, never from a diff: the same inputs
# are built once and tested once. The result conditions read job results and
# never `success()`, because a build or test skipped by its hash is
# `skipped`, and the default condition reads that through the whole chain.
#
# The caller's secrets are one: the vault's service account token.
# Everything else is read from the vault `<owner>-ci` (§ 3 PLX-Secrets): the
# apps' build-time keys always; the object-storage keys with a registry of
# the tenant's own; the cloud keys, the relay and the GitHub App under
# hybrid; the App also where the run plans a deploy, to read the platform
# repo's inventory.

on:
  workflow_call:
    inputs:
      strategy:
        description: >-
          Where the jobs run (§ 8 PLX-Delivery): `github`, the forge's runners;
          `on-prem`, the slots of the tenant's runner hosts (ci_runner_host)
          for every size; `hybrid`, slots for the small and medium jobs and a
          throwaway cloud instance for each large one.
        required: false
        type: string
        default: github
      registry:
        description: "Where the candidates live: `ghcr`, the forge's registry, beside the published images; `own`, the registry pair on the tenant's object storage."
        required: false
        type: string
        default: ghcr
      deploy:
        description: Plan the deploys too, for the release that follows on an environment branch; a pull request deploys nowhere.
        required: false
        type: boolean
        default: false
      environment:
        description: >-
          With `deploy`: the environment the run releases into. Empty derives
          it from the branch (main → production, develop → staging, else
          none), which is the rule; a caller sets it only to stand in for an
          environment branch.
        required: false
        type: string
        default: ''
      image-prefix:
        description: Where published images go, `<registry>/<owner>`; the image is `<prefix>/<app>:<sha>`. Default ghcr.io/<owner>.
        required: false
        type: string
        default: ''
      vault:
        description: The vault CI reads (§ 3 PLX-Secrets). Default <owner>-ci.
        required: false
        type: string
        default: ''
      alerts-email:
        description: Hybrid, the address mailed when an instance misses its boot and is kept; empty for no mail. A preset answer, never a vault item (§ 3 PLX-Secrets).
        required: false
        type: string
        default: ''
      instance-type:
        description: Hybrid, the type of the instances; empty for plx-ci's default.
        required: false
        type: string
        default: ''
      primitives-ref:
        description: >-
          A trial of an unreleased primitives: plx-ci and plx are built from a
          checkout of plexus-ms/primitives at this ref instead of the caller's
          pins. Empty for the pins.
        required: false
        type: string
        default: ''
    secrets:
      op-service-account-token:
        description: The vault's service account token, reading the vault `<owner>-ci`.
        required: true
    outputs:
      apps:
        description: Every app planned, with its hashes, JSON; what _release.yml publishes.
        value: ${{ jobs.plan.outputs.apps }}
      deploys:
        description: With `deploy`, the deploys of the release, JSON, for _release.yml; `[]` without an environment.
        value: ${{ jobs.plan.outputs.deploys }}
      environment:
        description: With `deploy`, the environment the run releases into; empty for none.
        value: ${{ jobs.plan.outputs.environment }}

permissions:
  contents: read
  packages: write
  actions: read

env:
  EXO_VERSION: 1.103.2
  CRANE_VERSION: 0.22.1
  CI_STRATEGY: ${{ inputs.strategy }}
  CI_REGISTRY: ${{ inputs.registry }}
  MAIL_TO: ${{ inputs.alerts-email }}
  VAULT: ${{ inputs.vault || format('{0}-ci', github.repository_owner) }}
  IMAGE_PREFIX: ${{ inputs.image-prefix || format('ghcr.io/{0}', github.repository_owner) }}

jobs:
  plan:
    runs-on: ${{ inputs.strategy == 'github' && 'ubuntu-latest' || 'ci-small' }}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      tests: ${{ steps.plan.outputs.tests }}
      apps: ${{ steps.plan.outputs.apps }}
      deploys: ${{ steps.plan.outputs.deploys }}
      environment: ${{ steps.plan.outputs.environment }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        if: ${{ inputs.primitives-ref == '' }}
        with:
          install_args: node npm:@plexus-ms/cli-ci
      - uses: actions/checkout@v7
        if: ${{ inputs.primitives-ref != '' }}
        with:
          repository: plexus-ms/primitives
          ref: ${{ inputs.primitives-ref }}
          path: .plx-ci
      - uses: actions/setup-node@v7
        if: ${{ inputs.primitives-ref != '' }}
        with:
          node-version-file: .plx-ci/mise.toml
      - name: plx-ci from the unreleased primitives
        if: ${{ inputs.primitives-ref != '' }}
        run: |
          cd .plx-ci && corepack enable && pnpm install --frozen-lockfile --ignore-scripts >/dev/null
          pnpm --filter @plexus-ms/cli-ci... run build >/dev/null
          mkdir -p bin && ln -sf "$PWD/packages/cli-ci/dist/plx-ci.js" bin/plx-ci && echo "$PWD/bin" >> "$GITHUB_PATH"
      - run: plx-ci --version
      - name: Load the registry's keys from the vault
        if: ${{ inputs.registry == 'own' }}
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.op-service-account-token }}
          REGISTRY_ENDPOINT: op://${{ env.VAULT }}/bucket-registry/endpoint
          REGISTRY_REGION: op://${{ env.VAULT }}/bucket-registry/region
          REGISTRY_ACCESS_KEY: op://${{ env.VAULT }}/bucket-registry/access-key-id
          REGISTRY_SECRET_KEY: op://${{ env.VAULT }}/bucket-registry/secret-access-key
      - name: Load the App's key from the vault
        if: ${{ inputs.deploy || inputs.strategy == 'hybrid' }}
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.op-service-account-token }}
          APP_PRIVATE_KEY: op://${{ env.VAULT }}/github-app/private-key
          APP_CLIENT_ID: op://${{ env.VAULT }}/github-app/client-id
      - name: Load the cloud's keys and the relay from the vault
        if: ${{ inputs.strategy == 'hybrid' }}
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.op-service-account-token }}
          EXOSCALE_API_KEY: op://${{ env.VAULT }}/exoscale/ci-launch/key
          EXOSCALE_API_SECRET: op://${{ env.VAULT }}/exoscale/ci-launch/secret
          SELF_DELETE_KEY: op://${{ env.VAULT }}/exoscale/ci-selfdelete/key
          SELF_DELETE_SECRET: op://${{ env.VAULT }}/exoscale/ci-selfdelete/secret
          SMTP_HOST: op://${{ env.VAULT }}/smtp-relay/host
          SMTP_PORT: op://${{ env.VAULT }}/smtp-relay/port
          SMTP_USER: op://${{ env.VAULT }}/smtp-relay/username
          SMTP_PASSWORD: op://${{ env.VAULT }}/smtp-relay/password
          MAIL_FROM: op://${{ env.VAULT }}/smtp-relay/from
      # Into the job's home, not /usr/local: a small or medium slot of a runner
      # host (ci_runner_host) runs with no-new-privileges, so sudo is no option.
      - name: Install exo
        if: ${{ inputs.strategy == 'hybrid' }}
        run: |
          mkdir -p "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL "https://github.com/exoscale/cli/releases/download/v${EXO_VERSION}/exoscale-cli_${EXO_VERSION}_linux_amd64.tar.gz" | tar -xz -C "$HOME/.local/bin" exo
      # Into the job's home, not /usr/local: a small or medium slot of a runner
      # host (ci_runner_host) runs with no-new-privileges, so sudo is no option.
      - name: Install crane
        if: ${{ inputs.registry == 'ghcr' }}
        run: |
          mkdir -p "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" | tar -xz -C "$HOME/.local/bin" crane
      - name: Log in to the forge's registry
        if: ${{ inputs.registry == 'ghcr' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: printf '%s' "$GITHUB_TOKEN" | crane auth login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: The registry
        run: plx-ci registry
      # Where each app deploys is the platform repo's inventory
      # (PLX-Environment), checked out with the tenant's App.
      - name: A token that may read the platform repo
        id: platform
        if: ${{ inputs.deploy }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ env.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: platform
          permission-contents: read
      - uses: actions/checkout@v7
        if: ${{ inputs.deploy }}
        with:
          repository: ${{ github.repository_owner }}/platform
          token: ${{ steps.platform.outputs.token }}
          path: platform
      - name: Plan
        id: plan
        env:
          DEPLOY: ${{ inputs.deploy && 'yes' || '' }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: plx-ci plan --test ${DEPLOY:+--deploy --environment "$ENVIRONMENT" --inventory platform/inventory}
      # Hybrid: one instance per image to build and per test to run, created
      # at once, each waited for until its runner is online. One that misses
      # is kept, stopped and mailed about, and replaced once.
      - name: A token that may register and remove runners on this repo
        id: runners
        if: ${{ inputs.strategy == 'hybrid' && (steps.plan.outputs.matrix != '[]' || steps.plan.outputs.tests != '[]') }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ env.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: write
      - name: Create the instances
        if: ${{ inputs.strategy == 'hybrid' && (steps.plan.outputs.matrix != '[]' || steps.plan.outputs.tests != '[]') }}
        env:
          RUNNER_TOKEN: ${{ steps.runners.outputs.token }}
          MATRIX: ${{ steps.plan.outputs.matrix }}
          TESTS: ${{ steps.plan.outputs.tests }}
          INSTANCE_TYPE: ${{ inputs.instance-type }}
          NO_JOB_MINUTES: 10
          DEATH_MINUTES: 45
          POWEROFF_MINUTES: 50
        run: plx-ci hybrid create-instances "$MATRIX" "$TESTS"

  build:
    needs: plan
    if: ${{ needs.plan.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        if: ${{ inputs.primitives-ref == '' }}
        with:
          install_args: node npm:@plexus-ms/cli-ci
      - uses: actions/checkout@v7
        if: ${{ inputs.primitives-ref != '' }}
        with:
          repository: plexus-ms/primitives
          ref: ${{ inputs.primitives-ref }}
          path: .plx-ci
      - uses: actions/setup-node@v7
        if: ${{ inputs.primitives-ref != '' }}
        with:
          node-version-file: .plx-ci/mise.toml
      - name: plx-ci from the unreleased primitives
        if: ${{ inputs.primitives-ref != '' }}
        run: |
          cd .plx-ci && corepack enable && pnpm install --frozen-lockfile --ignore-scripts >/dev/null
          pnpm --filter @plexus-ms/cli-ci... run build >/dev/null
          mkdir -p bin && ln -sf "$PWD/packages/cli-ci/dist/plx-ci.js" bin/plx-ci && echo "$PWD/bin" >> "$GITHUB_PATH"
      - name: The app's fixed Next key
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.op-service-account-token }}
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: op://${{ env.VAULT }}/app_${{ matrix.app }}/server-actions-key
      - name: Load the registry's keys from the vault
        if: ${{ inputs.registry == 'own' && inputs.strategy != 'hybrid' }}
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.op-service-account-token }}
          REGISTRY_ENDPOINT: op://${{ env.VAULT }}/bucket-registry/endpoint
          REGISTRY_REGION: op://${{ env.VAULT }}/bucket-registry/region
          REGISTRY_ACCESS_KEY: op://${{ env.VAULT }}/bucket-registry/access-key-id
          REGISTRY_SECRET_KEY: op://${{ env.VAULT }}/bucket-registry/secret-access-key
      - name: Log in to the forge's registry
        if: ${{ inputs.registry == 'ghcr' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: The registry
        run: plx-ci registry
      - name: Build
        run: plx-ci build "${{ matrix.app }}" "${{ matrix.hash }}" "$GITHUB_SHA"

  # After every build, whether or not one failed: a test whose candidate is
  # missing fails on its own, the others run. Not in a cancelled run.
  test:
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.tests != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.tests) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        if: ${{ inputs.primitives-ref == '' }}
        with:
          install_args: node npm:@plexus-ms/cli-ci
      - uses: actions/checkout@v7
        if: ${{ inputs.primitives-ref != '' }}
        with:
          repository: plexus-ms/primitives
          ref: ${{ inputs.primitives-ref }}
          path: .plx-ci
      - uses: actions/setup-node@v7
        if: ${{ inputs.primitives-ref != '' }}
        with:
          node-version-file: .plx-ci/mise.toml
      - name: plx-ci from the unreleased primitives
        if: ${{ inputs.primitives-ref != '' }}
        run: |
          cd .plx-ci && corepack enable && pnpm install --frozen-lockfile --ignore-scripts >/dev/null
          pnpm --filter @plexus-ms/cli-ci... run build >/dev/null
          mkdir -p bin && ln -sf "$PWD/packages/cli-ci/dist/plx-ci.js" bin/plx-ci && echo "$PWD/bin" >> "$GITHUB_PATH"
      - name: Load the registry's keys from the vault
        if: ${{ inputs.registry == 'own' && inputs.strategy != 'hybrid' }}
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.op-service-account-token }}
          REGISTRY_ENDPOINT: op://${{ env.VAULT }}/bucket-registry/endpoint
          REGISTRY_REGION: op://${{ env.VAULT }}/bucket-registry/region
          REGISTRY_ACCESS_KEY: op://${{ env.VAULT }}/bucket-registry/access-key-id
          REGISTRY_SECRET_KEY: op://${{ env.VAULT }}/bucket-registry/secret-access-key
      - name: Log in to the forge's registry
        if: ${{ inputs.registry == 'ghcr' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: The registry
        run: plx-ci registry
      # The specs and their dependencies, the app's own; Chromium with its
      # system libraries at the Playwright version the lockfile pins.
      - name: Install the app's dependencies and the browser
        run: |
          corepack enable && pnpm install --frozen-lockfile --filter "./apps/${{ matrix.app }}..."
          pnpm --filter "./apps/${{ matrix.app }}" exec playwright install --with-deps chromium
      - name: Test
        run: plx-ci test "${{ matrix.app }}" "${{ matrix.build }}" "${{ matrix.hash }}"

  # Hybrid: delete what this run launched, whatever the jobs ended in: an
  # instance a failed job left, or a runner that never took one. Skipped
  # where plan succeeded and launched nothing (one instance per entry of
  # matrix and of tests, so both empty is none); a plan that failed or was
  # cancelled may have launched part, and is cleaned up after. It never
  # fails the run: what it leaves, the instances' own deadlines and the
  # daily housekeeping remove.
  cleanup:
    needs: [plan, build, test]
    if: >-
      ${{ always() && inputs.strategy == 'hybrid' && needs.plan.result != 'skipped'
          && !(needs.plan.result == 'success' && needs.plan.outputs.matrix == '[]' && needs.plan.outputs.tests == '[]') }}
    continue-on-error: true
    runs-on: ${{ inputs.strategy == 'github' && 'ubuntu-latest' || 'ci-small' }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        if: ${{ inputs.primitives-ref == '' }}
        with:
          install_args: node npm:@plexus-ms/cli-ci
      - uses: actions/checkout@v7
        if: ${{ inputs.primitives-ref != '' }}
        with:
          repository: plexus-ms/primitives
          ref: ${{ inputs.primitives-ref }}
          path: .plx-ci
      - uses: actions/setup-node@v7
        if: ${{ inputs.primitives-ref != '' }}
        with:
          node-version-file: .plx-ci/mise.toml
      - name: plx-ci from the unreleased primitives
        if: ${{ inputs.primitives-ref != '' }}
        run: |
          cd .plx-ci && corepack enable && pnpm install --frozen-lockfile --ignore-scripts >/dev/null
          pnpm --filter @plexus-ms/cli-ci... run build >/dev/null
          mkdir -p bin && ln -sf "$PWD/packages/cli-ci/dist/plx-ci.js" bin/plx-ci && echo "$PWD/bin" >> "$GITHUB_PATH"
      - name: Load the cloud's key and the App's from the vault
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.op-service-account-token }}
          EXOSCALE_API_KEY: op://${{ env.VAULT }}/exoscale/ci-launch/key
          EXOSCALE_API_SECRET: op://${{ env.VAULT }}/exoscale/ci-launch/secret
          APP_PRIVATE_KEY: op://${{ env.VAULT }}/github-app/private-key
          APP_CLIENT_ID: op://${{ env.VAULT }}/github-app/client-id
      - name: A token that may register and remove runners on this repo
        id: runners
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ env.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: write
      # Into the job's home, not /usr/local: a small or medium slot of a runner
      # host (ci_runner_host) runs with no-new-privileges, so sudo is no option.
      - name: Install exo
        run: |
          mkdir -p "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL "https://github.com/exoscale/cli/releases/download/v${EXO_VERSION}/exoscale-cli_${EXO_VERSION}_linux_amd64.tar.gz" | tar -xz -C "$HOME/.local/bin" exo
      - name: Delete what this run launched
        env:
          RUNNER_TOKEN: ${{ steps.runners.outputs.token }}
        run: plx-ci hybrid destroy-instances
