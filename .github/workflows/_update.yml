name: _update

# Mounts the update verb (§ 3 PLX-Updates): the repo takes the train itself.
# `plx update` asks the forge for the preset's newest release, runs copier
# update at every site in a worktree of the branch the train lands on, syncs
# the marker, refreshes the lockfile, moves the workflow refs, and opens the
# pull request on `plexus/<version>`, the same one `plx ship` opens from the
# maintainers' workspace; whichever arrives first opens it, the other finds
# the branch and leaves it. A branch already on origin is never moved, so a
# scheduled run cannot overwrite a conflict somebody is resolving. The caller
# pins plx in its mise.toml, so the pull is made by the tool of the train the
# repo is on; a change to the pull itself therefore takes effect one train
# late.
#
# The push and the pull request are made with a token minted for a GitHub App
# of the tenant's own (`app_id` and `app_private_key`: contents and pull
# requests write on the repo), so that the branch's tip runs the repo's checks
# and the pull request is opened by an identity the tenant controls; a push
# with the workflow token starts no run. `token`, a fine-grained PAT, is the
# fallback. A platform repo's own runner has no `gh`; mise brings it.

on:
  workflow_call:
    inputs:
      train:
        description: The train to take; empty for the preset's newest release.
        required: false
        type: string
        default: ''
      runner:
        description: >-
          Runner label for every job: GitHub's `ubuntu-latest`, or the label of a
          runner the tenant owns (GitHub bills minutes only on its own runners).
        required: false
        type: string
        default: ubuntu-latest
      persistent:
        description: >-
          The runner keeps its disk between jobs (a runner the tenant owns):
          caches then stay on the machine instead of round-tripping through
          GitHub (§ 4 PLX-Delivery).
        required: false
        type: boolean
        default: false
      app_id:
        description: >-
          The ID of a GitHub App installed on the repo with contents and pull
          requests write; with `app_private_key`, the push and the pull request
          are made with a token minted for this job. Empty: `token` or the
          workflow token is used.
        required: false
        type: string
        default: ''
    secrets:
      app_private_key:
        description: The private key of the app named by `app_id`.
        required: false
      token:
        description: >-
          A token whose push starts the caller's workflows (a fine-grained PAT
          with contents and pull requests write), when no app is passed.
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ${{ inputs.runner }}
    steps:
      - id: app
        if: ${{ inputs.app_id != '' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ inputs.app_id }}
          private-key: ${{ secrets.app_private_key }}
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app.outputs.token || secrets.token || github.token }}
      - uses: jdx/mise-action@v5
        with:
          cache: ${{ !inputs.persistent }}
      - run: command -v gh >/dev/null || mise use --global gh@latest
      - run: plx -y update ${{ inputs.train != '' && format('--train {0}', inputs.train) || '' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.token || github.token }}
          GIT_AUTHOR_NAME: plx[bot]
          GIT_AUTHOR_EMAIL: plx-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: plx[bot]
          GIT_COMMITTER_EMAIL: plx-bot@users.noreply.github.com
