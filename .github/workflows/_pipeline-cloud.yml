name: _pipeline-cloud

# The cloud strategy of the pipeline (§§ 2 and 8 PLX-Delivery): one unit for
# the whole repo and run, mounted by the tenant's pipeline.yml. The forge's
# runners decide and copy, throwaway cloud instances build and test, and the
# registry is a sidecar on the tenant's object storage; nothing runs while no
# pipeline runs. The logic is plx-ci's and plx's (@plexus-ms/cli-ci and
# @plexus-ms/cli, pinned in the caller's mise.toml); every step here is one
# invocation.
#
#   plan            forge   the build and test hashes from one Turbo dry run, the look-ups,
#                           one builder per image to build and one test runner per test to run
#   check           forge   lint, typecheck and the pure tests, repo-wide, through the Turbo remote cache
#   build           cloud   the image from the pruned context, pushed to the sidecar as build-<hash> and <sha>
#   test            cloud   the app's compose stack on the candidate, its tests, the tag test-<hash>
#   release         forge   the tested manifest copied to GHCR (environment branches only)
#   deploy-targets  forge   each app's target in the environment, from the platform repo's inventory
#   deploy          forge   _deploy.yml per app with a target
#   teardown        forge   delete what this run launched
#
# A decision comes from a content hash, never from a diff: the same inputs
# are built once and tested once, and a promotion never builds. The result
# conditions read job results and never `success()`, because a build or test
# skipped by its hash is `skipped`, and the default condition reads that
# through the whole chain.
#
# The caller's secrets are one: the vault's service account token. Everything
# else (the cloud keys, the object-storage keys, the GitHub App, the relay, the
# runners' and the deploy key, the overlay's setup key, the apps' build-time
# keys) is read from
# the vault `<owner>-ci` (§ 3 PLX-Secrets).

on:
  workflow_call:
    inputs:
      tenant:
        description: Tenant slug, the first segment of the app dirs on the hosts (§ 3 PLX-Tenancy).
        required: true
        type: string
      image-prefix:
        description: Where released images go, `<registry>/<owner>`; the image is `<prefix>/<app>:<sha>`. Default ghcr.io/<owner>.
        required: false
        type: string
        default: ''
      vault:
        description: The vault CI reads (§ 3 PLX-Secrets). Default <owner>-ci.
        required: false
        type: string
        default: ''
      environment:
        description: >-
          The environment this run deploys into. Empty derives it from the
          branch (main → production, develop → staging, else none), which is
          the rule; a caller sets it only to stand in for an environment branch.
        required: false
        type: string
        default: ''
      overlay:
        description: "How the deploy job reaches the hosts: `netbird` joins the tenant's overlay as an ephemeral peer; empty reaches them as named."
        required: false
        type: string
        default: ''
      runner-small:
        description: >-
          The runner label of the small forge-side jobs (plan, release,
          deploy-targets, deploy, teardown): GitHub's `ubuntu-latest`, or a
          slot of the tenant's runner host (`ci-small`, ci_runner_host).
        required: false
        type: string
        default: ubuntu-latest
      runner-medium:
        description: The runner label of `check`, `ubuntu-latest` or a medium slot (`ci-medium`).
        required: false
        type: string
        default: ubuntu-latest
      dry-run:
        description: Deploy as `plx -n deploy`, printing the lines without reaching the host.
        required: false
        type: boolean
        default: false
      self-teardown:
        description: The instances' own teardown layers (runner exit, no job, death deadline); off only while a boot problem is being read.
        required: false
        type: boolean
        default: true
      alerts-email:
        description: The address mailed when an instance stalls or the sweep removes something; empty for no mail. A preset answer, never a vault item (§ 3 PLX-Secrets).
        required: false
        type: string
        default: ''
      primitives-ref:
        description: >-
          A trial of an unreleased primitives: plx-ci and plx are built from a
          checkout of plexus-ms/primitives at this ref instead of the caller's
          pins. Empty for the pins.
        required: false
        type: string
        default: ''
    secrets:
      op-service-account-token:
        description: The vault's service account token, reading the vault `<owner>-ci`.
        required: true

permissions:
  contents: read
  packages: write
  actions: read

env:
  EXO_VERSION: 1.103.2
  CRANE_VERSION: 0.22.1
  TENANT: ${{ inputs.tenant }}
  MAIL_TO: ${{ inputs.alerts-email }}
  VAULT: ${{ inputs.vault || format('{0}-ci', github.repository_owner) }}
  IMAGE_PREFIX: ${{ inputs.image-prefix || format('ghcr.io/{0}', github.repository_owner) }}

jobs:
  plan:
    runs-on: ${{ inputs.runner-small }}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      tests: ${{ steps.plan.outputs.tests }}
      apps: ${{ steps.plan.outputs.apps }}
      kept: ${{ steps.plan.outputs.kept }}
      environment: ${{ steps.environment.outputs.environment }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        if: ${{ inputs.primitives-ref == '' }}
        with:
          install_args: node npm:@plexus-ms/cli-ci
      - uses: actions/checkout@v7
        if: ${{ inputs.primitives-ref != '' }}
        with:
          repository: plexus-ms/primitives
          ref: ${{ inputs.primitives-ref }}
          path: .plx-ci
      - uses: actions/setup-node@v7
        if: ${{ inputs.primitives-ref != '' }}
        with:
          node-version-file: mise.toml
      - name: plx-ci from the unreleased primitives
        if: ${{ inputs.primitives-ref != '' }}
        run: |
          cd .plx-ci && corepack enable && pnpm install --frozen-lockfile --ignore-scripts >/dev/null
          pnpm --filter @plexus-ms/cli-ci... run build >/dev/null
          mkdir -p bin && ln -sf "$PWD/packages/cli-ci/dist/plx-ci.js" bin/plx-ci && echo "$PWD/bin" >> "$GITHUB_PATH"
      - run: plx-ci --version
      # The environment a push deploys into (§ 3 PLX-Delivery): main is
      # production, develop is staging, a run by hand on either the same; a
      # pull request deploys nowhere.
      - name: Which environment
        id: environment
        env:
          GIVEN: ${{ inputs.environment }}
        run: |
          environment="$GIVEN"
          if [ -z "$environment" ]; then
            case "$GITHUB_EVENT_NAME/$GITHUB_REF_NAME" in
              push/main | workflow_dispatch/main) environment=production ;;
              push/develop | workflow_dispatch/develop) environment=staging ;;
            esac
          fi
          echo "environment=$environment" | tee -a "$GITHUB_OUTPUT"
      - name: Load the CI secrets from the vault
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.op-service-account-token }}
          EXOSCALE_API_KEY: op://${{ env.VAULT }}/exoscale/ci-launch/key
          EXOSCALE_API_SECRET: op://${{ env.VAULT }}/exoscale/ci-launch/secret
          SELF_DELETE_KEY: op://${{ env.VAULT }}/exoscale/ci-selfdelete/key
          SELF_DELETE_SECRET: op://${{ env.VAULT }}/exoscale/ci-selfdelete/secret
          SMTP_HOST: op://${{ env.VAULT }}/smtp-relay/host
          SMTP_PORT: op://${{ env.VAULT }}/smtp-relay/port
          SMTP_USER: op://${{ env.VAULT }}/smtp-relay/username
          SMTP_PASSWORD: op://${{ env.VAULT }}/smtp-relay/password
          MAIL_FROM: op://${{ env.VAULT }}/smtp-relay/from
          REGISTRY_ENDPOINT: op://${{ env.VAULT }}/bucket-registry/endpoint
          REGISTRY_REGION: op://${{ env.VAULT }}/bucket-registry/region
          REGISTRY_ACCESS_KEY: op://${{ env.VAULT }}/bucket-registry/access-key-id
          REGISTRY_SECRET_KEY: op://${{ env.VAULT }}/bucket-registry/secret-access-key
          APP_PRIVATE_KEY: op://${{ env.VAULT }}/github-app/private-key
          APP_CLIENT_ID: op://${{ env.VAULT }}/github-app/client-id
          # The key the instances are created with (the cloud's key `runners`),
          # for reading a stalled boot; never the deploy key.
          DIAG_SSH_PRIVATE_KEY: op://${{ env.VAULT }}/runners-ssh/private key?ssh-format=openssh
      - name: A token that may register and remove runners on this repo
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ env.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: write
      - name: Install exo
        # Into the job's home, not /usr/local: a slot of a runner host
        # (ci_runner_host) runs with no-new-privileges, so sudo is no option.
        run: |
          mkdir -p "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL "https://github.com/exoscale/cli/releases/download/v${EXO_VERSION}/exoscale-cli_${EXO_VERSION}_linux_amd64.tar.gz" | tar -xz -C "$HOME/.local/bin" exo
      - name: The registry sidecars
        run: plx-ci registry
      # The hashes from one Turbo dry run, the look-ups, one runner per image
      # to build and per test to run, launched at once; the first missed
      # instance is kept for reading.
      - name: Plan and launch
        id: plan
        env:
          RUNNER_TOKEN: ${{ steps.app.outputs.token }}
          NO_JOB_MINUTES: 10
          DEATH_MINUTES: 45
          POWEROFF_MINUTES: 50
          LAUNCH_TRIES: 3
          SELF_LAYERS: ${{ inputs.self-teardown && 'on' || 'off' }}
        run: |
          umask 077; printf '%s\n' "$DIAG_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/runners.key"
          export DIAG_SSH_KEY="$RUNNER_TEMP/runners.key" KEEP_MISSED="$RUNNER_TEMP/kept"
          plx-ci plan --mode build --tests
          kept=$(cat "$KEEP_MISSED" 2>/dev/null || true)
          [ -z "$kept" ] || echo "::warning::instance $kept kept for inspection (a stalled boot); plx-ci inspect $kept, then delete it"

  # Lint, typecheck and the pure unit tests, repo-wide, where no Docker is
  # needed; the Turbo remote cache in the tenant's bucket makes an unchanged
  # package free.
  check:
    runs-on: ${{ inputs.runner-medium }}
    steps:
      - uses: actions/checkout@v7
      - name: Load the Turbo cache bucket's keys from the vault
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.op-service-account-token }}
          TURBO_CACHE_ENDPOINT: op://${{ env.VAULT }}/bucket-turbo/endpoint
          TURBO_CACHE_REGION: op://${{ env.VAULT }}/bucket-turbo/region
          TURBO_CACHE_ACCESS_KEY: op://${{ env.VAULT }}/bucket-turbo/access-key-id
          TURBO_CACHE_SECRET_KEY: op://${{ env.VAULT }}/bucket-turbo/secret-access-key
      # A cache server for the length of the job, on loopback, backed by the
      # bucket <owner>-ci-turbo; its token is minted here and never leaves.
      - name: Prepare the Turbo remote cache
        id: turbo-cache
        run: |
          token=$(openssl rand -hex 32)
          echo "::add-mask::$token"
          echo "bucket=${GITHUB_REPOSITORY_OWNER}-ci-turbo" >> "$GITHUB_OUTPUT"
          {
            echo "TURBO_API=http://127.0.0.1:8585"
            echo "TURBO_TOKEN=$token"
            echo "TURBO_TEAM=${GITHUB_REPOSITORY//\//-}"
          } >> "$GITHUB_ENV"
      - uses: brunojppb/turbo-cache-server@7a089b8e7cf1579794644119a3561bbb1314c946 # 5.0.0
        env:
          PORT: 8585
          S3_ENDPOINT: ${{ env.TURBO_CACHE_ENDPOINT }}
          S3_REGION: ${{ env.TURBO_CACHE_REGION }}
          S3_BUCKET_NAME: ${{ steps.turbo-cache.outputs.bucket }}
          S3_ACCESS_KEY: ${{ env.TURBO_CACHE_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ env.TURBO_CACHE_SECRET_KEY }}
          S3_USE_PATH_STYLE: 'true'
      - uses: jdx/mise-action@v5
      - run: mise lint
      - run: mise check

  build:
    needs: plan
    if: ${{ needs.plan.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.label }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        if: ${{ inputs.primitives-ref == '' }}
        with:
          install_args: node npm:@plexus-ms/cli-ci
      - uses: actions/checkout@v7
        if: ${{ inputs.primitives-ref != '' }}
        with:
          repository: plexus-ms/primitives
          ref: ${{ inputs.primitives-ref }}
          path: .plx-ci
      - uses: actions/setup-node@v7
        if: ${{ inputs.primitives-ref != '' }}
        with:
          node-version-file: mise.toml
      - name: plx-ci from the unreleased primitives
        if: ${{ inputs.primitives-ref != '' }}
        run: |
          cd .plx-ci && corepack enable && pnpm install --frozen-lockfile --ignore-scripts >/dev/null
          pnpm --filter @plexus-ms/cli-ci... run build >/dev/null
          mkdir -p bin && ln -sf "$PWD/packages/cli-ci/dist/plx-ci.js" bin/plx-ci && echo "$PWD/bin" >> "$GITHUB_PATH"
      - name: The app's fixed Next key
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.op-service-account-token }}
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: op://${{ env.VAULT }}/app_${{ matrix.app }}/server-actions-key
      - name: Build
        run: plx-ci build "${{ matrix.app }}" "${{ matrix.hash }}" "$GITHUB_SHA"

  # After every build, whether or not one failed: a test whose candidate is
  # missing fails on its own, the others run. The runner was launched by the
  # plan and prepared while the build ran.
  test:
    needs: [plan, build]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.tests != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.tests) }}
    runs-on: ${{ matrix.label }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        if: ${{ inputs.primitives-ref == '' }}
        with:
          install_args: node npm:@plexus-ms/cli-ci
      - uses: actions/checkout@v7
        if: ${{ inputs.primitives-ref != '' }}
        with:
          repository: plexus-ms/primitives
          ref: ${{ inputs.primitives-ref }}
          path: .plx-ci
      - uses: actions/setup-node@v7
        if: ${{ inputs.primitives-ref != '' }}
        with:
          node-version-file: mise.toml
      - name: plx-ci from the unreleased primitives
        if: ${{ inputs.primitives-ref != '' }}
        run: |
          cd .plx-ci && corepack enable && pnpm install --frozen-lockfile --ignore-scripts >/dev/null
          pnpm --filter @plexus-ms/cli-ci... run build >/dev/null
          mkdir -p bin && ln -sf "$PWD/packages/cli-ci/dist/plx-ci.js" bin/plx-ci && echo "$PWD/bin" >> "$GITHUB_PATH"
      # The specs and their dependencies, the app's own; Chromium with its
      # system libraries at the Playwright version the lockfile pins.
      - name: Install the app's dependencies and the browser
        run: |
          corepack enable && pnpm install --frozen-lockfile --filter "./apps/${{ matrix.app }}..."
          pnpm --filter "./apps/${{ matrix.app }}" exec playwright install --with-deps chromium
      - name: Test
        run: plx-ci test "${{ matrix.app }}" "${{ matrix.build }}" "${{ matrix.hash }}"

  # On an environment branch, once check passed and no build or test failed.
  release:
    needs: [plan, check, build, test]
    if: >-
      ${{ always()
        && needs.plan.outputs.environment != ''
        && needs.plan.result == 'success'
        && needs.check.result == 'success'
        && !contains(fromJSON('["failure", "cancelled"]'), needs.build.result)
        && !contains(fromJSON('["failure", "cancelled"]'), needs.test.result) }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.apps) }}
    runs-on: ${{ inputs.runner-small }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        if: ${{ inputs.primitives-ref == '' }}
        with:
          install_args: node npm:@plexus-ms/cli-ci
      - uses: actions/checkout@v7
        if: ${{ inputs.primitives-ref != '' }}
        with:
          repository: plexus-ms/primitives
          ref: ${{ inputs.primitives-ref }}
          path: .plx-ci
      - uses: actions/setup-node@v7
        if: ${{ inputs.primitives-ref != '' }}
        with:
          node-version-file: mise.toml
      - name: plx-ci from the unreleased primitives
        if: ${{ inputs.primitives-ref != '' }}
        run: |
          cd .plx-ci && corepack enable && pnpm install --frozen-lockfile --ignore-scripts >/dev/null
          pnpm --filter @plexus-ms/cli-ci... run build >/dev/null
          mkdir -p bin && ln -sf "$PWD/packages/cli-ci/dist/plx-ci.js" bin/plx-ci && echo "$PWD/bin" >> "$GITHUB_PATH"
      - name: Load the registry's keys from the vault
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.op-service-account-token }}
          REGISTRY_ENDPOINT: op://${{ env.VAULT }}/bucket-registry/endpoint
          REGISTRY_REGION: op://${{ env.VAULT }}/bucket-registry/region
          REGISTRY_ACCESS_KEY: op://${{ env.VAULT }}/bucket-registry/access-key-id
          REGISTRY_SECRET_KEY: op://${{ env.VAULT }}/bucket-registry/secret-access-key
      - name: Install exo and crane
        # Into the job's home, not /usr/local: a slot of a runner host
        # (ci_runner_host) runs with no-new-privileges, so sudo is no option.
        run: |
          mkdir -p "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL "https://github.com/exoscale/cli/releases/download/v${EXO_VERSION}/exoscale-cli_${EXO_VERSION}_linux_amd64.tar.gz" | tar -xz -C "$HOME/.local/bin" exo
          curl -fsSL "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" | tar -xz -C "$HOME/.local/bin" crane
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: printf '%s' "$GITHUB_TOKEN" | crane auth login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: The registry sidecars
        run: plx-ci registry
      - name: Release
        env:
          TEST: ${{ matrix.test }}
        run: plx-ci release "${{ matrix.app }}" "${{ matrix.hash }}" "$GITHUB_SHA" ${TEST:+--test "$TEST"}

  # Where each app deploys in the environment: the platform repo's inventory
  # (PLX-Environment), checked out with the tenant's App; an app without a
  # record there has no deployment there and ends in a notice.
  deploy-targets:
    needs: [plan, release]
    if: ${{ always() && needs.plan.result == 'success' && needs.release.result == 'success' }}
    runs-on: ${{ inputs.runner-small }}
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        if: ${{ inputs.primitives-ref == '' }}
        with:
          install_args: node npm:@plexus-ms/cli
      - uses: actions/checkout@v7
        if: ${{ inputs.primitives-ref != '' }}
        with:
          repository: plexus-ms/primitives
          ref: ${{ inputs.primitives-ref }}
          path: .plx-ci
      - uses: actions/setup-node@v7
        if: ${{ inputs.primitives-ref != '' }}
        with:
          node-version-file: mise.toml
      - name: plx from the unreleased primitives
        if: ${{ inputs.primitives-ref != '' }}
        run: |
          cd .plx-ci && corepack enable && pnpm install --frozen-lockfile --ignore-scripts >/dev/null
          pnpm --filter @plexus-ms/cli... run build >/dev/null
          mkdir -p bin && ln -sf "$PWD/packages/cli/dist/plx.js" bin/plx && echo "$PWD/bin" >> "$GITHUB_PATH"
      - name: Load the App's key from the vault
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.op-service-account-token }}
          APP_PRIVATE_KEY: op://${{ env.VAULT }}/github-app/private-key
          APP_CLIENT_ID: op://${{ env.VAULT }}/github-app/client-id
      - name: A token that may read the platform repo
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ env.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: platform
          permission-contents: read
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/platform
          token: ${{ steps.app.outputs.token }}
          path: platform
      - name: The targets
        id: targets
        env:
          APPS: ${{ needs.plan.outputs.apps }}
          ENVIRONMENT: ${{ needs.plan.outputs.environment }}
        run: |
          targets=$(plx deploy-targets --environment "$ENVIRONMENT" platform/inventory)
          matrix=$(jq -cn --argjson apps "$APPS" --argjson targets "$targets" --arg prefix "$IMAGE_PREFIX" --arg sha "$GITHUB_SHA" \
            '[$apps[] | select($targets[.app] != null) | {app, host: $targets[.app], image: (($prefix + "/" + .app + ":" + $sha) | ascii_downcase)}]')
          for app in $(jq -rn --argjson apps "$APPS" --argjson targets "$targets" '$apps[] | select($targets[.app] == null) | .app'); do
            echo "::notice::$app has no deployment in $ENVIRONMENT; nothing to deploy"
          done
          echo "matrix=$matrix" | tee -a "$GITHUB_OUTPUT"

  # One deploy per app with a target, through the deploy mount; it reads the
  # deploy key and the overlay's setup key from the same vault.
  # Pinned at the train like every reusable reference; the train rewrites it.
  deploy:
    needs: [plan, deploy-targets]
    if: ${{ always() && needs.deploy-targets.result == 'success' && needs.deploy-targets.outputs.matrix != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.deploy-targets.outputs.matrix) }}
    uses: plexus-ms/primitives/.github/workflows/_deploy.yml@0.110.0
    with:
      runner: ${{ inputs.runner-small }}
      tenant: ${{ inputs.tenant }}
      app: ${{ matrix.app }}
      image-ref: ${{ matrix.image }}
      host: ${{ matrix.host }}
      environment: ${{ needs.plan.outputs.environment }}
      overlay: ${{ inputs.overlay }}
      vault: ${{ inputs.vault }}
      dry-run: ${{ inputs.dry-run }}
      primitives-ref: ${{ inputs.primitives-ref }}
    secrets:
      op-service-account-token: ${{ secrets.op-service-account-token }}

  # Delete what this run launched, whatever the jobs ended in: an instance a
  # failed job left, or a runner that never took one.
  # Skipped where plan succeeded and launched nothing (one instance per entry
  # of matrix and of tests, so both empty is none); a plan that failed or was
  # cancelled may have launched part, and is torn down.
  teardown:
    needs: [plan, build, test]
    if: >-
      ${{ always() && needs.plan.result != 'skipped'
          && !(needs.plan.result == 'success' && needs.plan.outputs.matrix == '[]' && needs.plan.outputs.tests == '[]') }}
    runs-on: ${{ inputs.runner-small }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        if: ${{ inputs.primitives-ref == '' }}
        with:
          install_args: node npm:@plexus-ms/cli-ci
      - uses: actions/checkout@v7
        if: ${{ inputs.primitives-ref != '' }}
        with:
          repository: plexus-ms/primitives
          ref: ${{ inputs.primitives-ref }}
          path: .plx-ci
      - uses: actions/setup-node@v7
        if: ${{ inputs.primitives-ref != '' }}
        with:
          node-version-file: mise.toml
      - name: plx-ci from the unreleased primitives
        if: ${{ inputs.primitives-ref != '' }}
        run: |
          cd .plx-ci && corepack enable && pnpm install --frozen-lockfile --ignore-scripts >/dev/null
          pnpm --filter @plexus-ms/cli-ci... run build >/dev/null
          mkdir -p bin && ln -sf "$PWD/packages/cli-ci/dist/plx-ci.js" bin/plx-ci && echo "$PWD/bin" >> "$GITHUB_PATH"
      - name: Load the CI secrets from the vault
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.op-service-account-token }}
          EXOSCALE_API_KEY: op://${{ env.VAULT }}/exoscale/ci-launch/key
          EXOSCALE_API_SECRET: op://${{ env.VAULT }}/exoscale/ci-launch/secret
          APP_PRIVATE_KEY: op://${{ env.VAULT }}/github-app/private-key
          APP_CLIENT_ID: op://${{ env.VAULT }}/github-app/client-id
      - name: A token that may register and remove runners on this repo
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ env.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: write
      - name: Install exo
        # Into the job's home, not /usr/local: a slot of a runner host
        # (ci_runner_host) runs with no-new-privileges, so sudo is no option.
        run: |
          mkdir -p "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL "https://github.com/exoscale/cli/releases/download/v${EXO_VERSION}/exoscale-cli_${EXO_VERSION}_linux_amd64.tar.gz" | tar -xz -C "$HOME/.local/bin" exo
      - name: Delete what this run launched
        env:
          RUNNER_TOKEN: ${{ steps.app.outputs.token }}
          KEEP_IDS: ${{ needs.plan.outputs.kept }}
        run: plx-ci teardown
