name: _deploy

# Mounts the deploy verb (§ 6 PLX-Delivery): launch a released artifact into
# an execution environment. Logic lives in `plx deploy` (@plexus-ms/cli,
# pinned in the caller's mise.toml), never here; the caller supplies the host
# and the environment. The caller is the app's SOURCE repo, because the verb
# reads apps/<app>/docker/compose.yaml from the checkout and renders it onto
# the host with the image ref pinned: an app repo's release after the
# publish, or the platform repo's deploy.yml for a third-party app, whose
# compose.yaml pins its own image (no image-ref).
#
# The keys come from the vault `<owner>-ci` (§ 3 PLX-Secrets), read with its
# service account token: `deploy-ssh/private key`, and `netbird/setup-key`
# where the job joins the overlay.
#
# The host is reached as named, or, with `overlay: netbird`, over the tenant's
# overlay. A slot of a runner host is on the overlay already, through the
# host's network, so only a job on the forge's runners joins: as an ephemeral
# peer with a setup key whose policy allows the app hosts' SSH and nothing
# else; it deploys and leaves. Joining is the job's environment, like the SSH
# agent, so it is steps here and no verb.

on:
  workflow_call:
    inputs:
      strategy:
        description: >-
          Where the job runs (§ 8 PLX-Delivery): `github`, the forge's runners;
          `on-prem` or `hybrid`, a small slot of the tenant's runner host.
        required: false
        type: string
        default: github
      tenant:
        description: Tenant id — first segment of the app dir (/opt/stacks/<tenant>/<app>).
        required: true
        type: string
      app:
        required: true
        type: string
      image-ref:
        description: >-
          Full image ref to deploy (name:tag), the release's output. Empty for
          a third-party app whose compose.yaml pins its own image.
        required: false
        type: string
        default: ''
      host:
        description: SSH target, e.g. deploy@1.2.3.4 or ssh://deploy@vm.example.internal.
        required: true
        type: string
      environment:
        description: The environment deployed into (PLX-Environment); decides the app dir's slug on the host. Default production.
        required: false
        type: string
        default: production
      health-url:
        description: >-
          Healthcheck URL polled on the host. Defaults to the app's readiness
          path (/healthz, or its plexus.healthz label) on its loopback port
          (PLEXUS_LOOPBACK_PORT in the app dir's .env).
        required: false
        type: string
        default: ''
      overlay:
        description: "`netbird`: the host is on the tenant's overlay, which a job on the forge's runners joins for its length; `none` reaches the host as named."
        required: false
        type: string
        default: none
      netbird-version:
        description: The NetBird client the job installs, from pkgs.netbird.io.
        required: false
        type: string
        default: 0.82.0
      vault:
        description: The vault the keys are read from (§ 3 PLX-Secrets). Default <owner>-ci.
        required: false
        type: string
        default: ''
      dry-run:
        description: "`plx -n deploy`: print every line the deploy would run; the verb reaches no host, and one `true` over ssh proves the host is reachable."
        required: false
        type: boolean
        default: false
      primitives-ref:
        description: A trial of an unreleased primitives, plx built from this ref instead of the caller's pin; empty for the pin.
        required: false
        type: string
        default: ''
    secrets:
      op-service-account-token:
        description: The vault's service account token, reading the vault `<owner>-ci`.
        required: true

permissions:
  contents: read

env:
  VAULT: ${{ inputs.vault || format('{0}-ci', github.repository_owner) }}

jobs:
  deploy:
    runs-on: ${{ inputs.strategy == 'github' && 'ubuntu-latest' || 'ci-small' }}
    # Serialize deploys per app and environment: at most one running and one
    # pending run per group, and GitHub replaces the pending run with the
    # newest — so the newest commit always deploys last. Never cancels a
    # mid-flight deploy (cancelling between migrate and up would strand the
    # host).
    concurrency:
      group: deploy-${{ inputs.tenant }}-${{ inputs.app }}-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.op-service-account-token }}
    steps:
      # The caller's repo (the app's source repo) — cwd for the verb, which
      # reads apps/<app>/ relative here. Same SHA the image was built from.
      - uses: actions/checkout@v7
      # The caller's tools, plx among them.
      - uses: jdx/mise-action@v5
      - uses: actions/checkout@v7
        if: ${{ inputs.primitives-ref != '' }}
        with:
          repository: plexus-ms/primitives
          ref: ${{ inputs.primitives-ref }}
          path: .plx-ci
      - name: plx from the unreleased primitives
        if: ${{ inputs.primitives-ref != '' }}
        run: |
          cd .plx-ci && corepack enable && pnpm install --frozen-lockfile --ignore-scripts >/dev/null
          pnpm --filter @plexus-ms/cli... run build >/dev/null
          mkdir -p bin && ln -sf "$PWD/packages/cli/dist/plx.js" bin/plx && echo "$PWD/bin" >> "$GITHUB_PATH"
      - name: Load the deploy key from the vault
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          # OpenSSH form on purpose: the vault stores a key as PKCS#8 and hands
          # that out by default, which ssh-add does not take for every key type.
          SSH_KEY: op://${{ env.VAULT }}/deploy-ssh/private key?ssh-format=openssh
      - name: Load the overlay's setup key from the vault
        if: ${{ inputs.overlay == 'netbird' && inputs.strategy == 'github' }}
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          NB_SETUP_KEY: op://${{ env.VAULT }}/netbird/setup-key
      # An ephemeral peer for the length of the job: the client from NetBird's
      # repository at a pinned version, joined with the setup key in the
      # environment (never on argv), and the job waits until the management
      # server lists it as connected. Only on the forge's runners: a slot of a
      # runner host shares the network of a host that is a peer itself.
      - name: Join the overlay
        if: ${{ inputs.overlay == 'netbird' && inputs.strategy == 'github' }}
        env:
          NETBIRD_VERSION: ${{ inputs.netbird-version }}
        run: |
          host='${{ inputs.host }}'; host=${host#ssh://}; host=${host##*@}; host=${host%%:*}
          echo "joined=true" >> "$GITHUB_ENV"
          curl -fsSL https://pkgs.netbird.io/debian/public.key | sudo gpg --dearmor -o /usr/share/keyrings/netbird-archive-keyring.gpg
          echo 'deb [signed-by=/usr/share/keyrings/netbird-archive-keyring.gpg] https://pkgs.netbird.io/debian stable main' | sudo tee /etc/apt/sources.list.d/netbird.list >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq "netbird=$NETBIRD_VERSION" >/dev/null
          sudo --preserve-env=NB_SETUP_KEY netbird up --hostname "ci-${GITHUB_RUN_ID}"
          for _ in $(seq 1 30); do sudo netbird status | grep -q 'Management: Connected' && break; sleep 1; done
          # The names arrive with the network map, some seconds after the
          # management connection; peers stay idle until traffic, so the
          # host's name resolving is the readiness that matters.
          for _ in $(seq 1 60); do getent hosts "$host" >/dev/null && break; sleep 1; done
          sudo netbird status
          getent hosts "$host"
      # A key pasted into a one-line field arrives with spaces for its line
      # breaks; its lines are restored before the agent reads it.
      - name: Load the SSH key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          key="$SSH_KEY"
          if [ "$(printf '%s\n' "$key" | wc -l)" -le 1 ]; then
            key=$(printf '%s' "$key" | sed -E 's/^(-----BEGIN [A-Z0-9 ]+-----) */\1\n/; s/ *(-----END [A-Z0-9 ]+-----)$/\n\1/' | awk 'NR==2 { gsub(/ /, "\n") } { print }')
          fi
          printf '%s\n' "$key" | ssh-add -
      # The dry run's one effect: the path to the host (its name, the overlay's
      # policy, the key) is proven before a real deploy relies on it.
      - name: Reach the host
        if: ${{ inputs.dry-run }}
        run: ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new '${{ inputs.host }}' -- 'echo "reached $(hostname) as $(id -un)"'
      # An empty option value is the same as an absent one to the verb, so
      # both flags are always passed.
      - name: Deploy
        run: plx ${{ inputs.dry-run && '-n' || '' }} deploy '${{ inputs.host }}' '${{ inputs.tenant }}' '${{ inputs.app }}' --environment '${{ inputs.environment }}' --image '${{ inputs.image-ref }}' --health-url '${{ inputs.health-url }}'
      # A GitHub-hosted runner dies with the agent; a persistent one would keep
      # it running, deploy key loaded, for every later job on the machine. The
      # same for the overlay: the peer leaves, and the management server drops
      # it as ephemeral.
      - name: Stop the SSH agent
        if: ${{ always() }}
        run: '[ -z "${SSH_AGENT_PID:-}" ] || ssh-agent -k'
      - name: Leave the overlay
        if: ${{ always() && env.joined == 'true' }}
        run: sudo netbird down || true
