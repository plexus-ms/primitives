name: _sweep

# The last teardown layer of the cloud strategy (§ 8 PLX-Delivery), mounted
# on a schedule in the tenant's platform repo: delete every CI instance on the
# cloud that is stopped or past its death deadline, drop the registry bucket
# of two months ago, and mail when something was removed. Logic lives in
# `plx-ci sweep` (@plexus-ms/cli-ci, pinned in the caller's mise.toml), never
# here.

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label for the job; GitHub's `ubuntu-latest` by default.
        required: false
        type: string
        default: ubuntu-latest
      vault:
        description: The vault CI reads (§ 3 PLX-Secrets). Default <owner>-ci.
        required: false
        type: string
        default: ''
      dry-run:
        description: Only list what would be deleted.
        required: false
        type: boolean
        default: false
      alerts-email:
        description: The address mailed when an instance stalls or the sweep removes something; empty for no mail. A preset answer, never a vault item (§ 3 PLX-Secrets).
        required: false
        type: string
        default: ''
      primitives-ref:
        description: A trial of an unreleased primitives, built from this ref instead of the caller's pin; empty for the pin.
        required: false
        type: string
        default: ''
    secrets:
      op-service-account-token:
        description: The vault's service account token.
        required: true

permissions:
  contents: read

env:
  EXO_VERSION: 1.103.2
  VAULT: ${{ inputs.vault || format('{0}-ci', github.repository_owner) }}
  MAIL_TO: ${{ inputs.alerts-email }}

jobs:
  sweep:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        if: ${{ inputs.primitives-ref == '' }}
        with:
          install_args: node npm:@plexus-ms/cli-ci
      - uses: actions/checkout@v7
        if: ${{ inputs.primitives-ref != '' }}
        with:
          repository: plexus-ms/primitives
          ref: ${{ inputs.primitives-ref }}
          path: .plx-ci
      - uses: actions/setup-node@v7
        if: ${{ inputs.primitives-ref != '' }}
        with:
          node-version-file: .plx-ci/mise.toml
      - name: plx-ci from the unreleased primitives
        if: ${{ inputs.primitives-ref != '' }}
        run: |
          cd .plx-ci && corepack enable && pnpm install --frozen-lockfile --ignore-scripts >/dev/null
          pnpm --filter @plexus-ms/cli-ci... run build >/dev/null
          mkdir -p bin && ln -sf "$PWD/packages/cli-ci/dist/plx-ci.js" bin/plx-ci && echo "$PWD/bin" >> "$GITHUB_PATH"
      - name: Load the CI secrets from the vault
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.op-service-account-token }}
          EXOSCALE_API_KEY: op://${{ env.VAULT }}/exoscale/ci-launch/key
          EXOSCALE_API_SECRET: op://${{ env.VAULT }}/exoscale/ci-launch/secret
          SMTP_HOST: op://${{ env.VAULT }}/smtp-relay/host
          SMTP_PORT: op://${{ env.VAULT }}/smtp-relay/port
          SMTP_USER: op://${{ env.VAULT }}/smtp-relay/username
          SMTP_PASSWORD: op://${{ env.VAULT }}/smtp-relay/password
          MAIL_FROM: op://${{ env.VAULT }}/smtp-relay/from
          REGISTRY_REGION: op://${{ env.VAULT }}/bucket-registry/region
          REGISTRY_ACCESS_KEY: op://${{ env.VAULT }}/bucket-registry/access-key-id
          REGISTRY_SECRET_KEY: op://${{ env.VAULT }}/bucket-registry/secret-access-key
      - name: Install exo
        # Into the job's home, not /usr/local: a slot of a runner host
        # (ci_runner_host) runs with no-new-privileges, so sudo is no option.
        run: |
          mkdir -p "$HOME/.local/bin" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL "https://github.com/exoscale/cli/releases/download/v${EXO_VERSION}/exoscale-cli_${EXO_VERSION}_linux_amd64.tar.gz" | tar -xz -C "$HOME/.local/bin" exo
      - name: Sweep
        run: plx-ci ${{ inputs.dry-run && '-n' || '' }} sweep
